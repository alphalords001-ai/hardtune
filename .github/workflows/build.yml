name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurer
        run: cmake -B build -A x64

      - name: Compiler
        shell: pwsh
        run: |
          #  Le journal brut n'est pas forcément lisible par l'agent : on
          #  republie les erreurs du compilateur en annotations, lisibles par
          #  l'API (/check-runs/.../annotations).
          $ErrorActionPreference = 'Continue'
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build-msvc.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $hits = @(Get-Content build-msvc.log |
                      Select-String -Pattern ': error |error C[0-9]{4}|error LNK[0-9]{4}' |
                      ForEach-Object { $_.Line.Trim() } |
                      Select-Object -Unique |
                      Select-Object -First 8)
            if ($hits.Count -eq 0) {
              $hits = @(Get-Content build-msvc.log -Tail 12 | ForEach-Object { $_.Trim() })
            }
            foreach ($h in $hits) { Write-Host "::error::$h" }
            exit 1
          }

      # -----------------------------------------------------------------------
      #  Un rapport de crash FL Studio donne : "in module HardTune.vst3
      #  (offset D5356)". On traduit ces offsets en noms de fonctions via le
      #  .map du binaire, et on publie le resultat en annotations (lisibles par
      #  l'API GitHub, donc par l'agent). Cette etape ne doit JAMAIS faire
      #  echouer le build.
      # -----------------------------------------------------------------------
      - name: Traduire les offsets de plantage en fonctions
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $targets = @(0xB6302, 0xB77C2, 0xB73DA, 0xD5356, 0xD5346, 0xA77C2, 0xA73DA)

          try {
            $maps = @(Get-ChildItem build -Recurse -Filter *.map -ErrorAction SilentlyContinue)
            if ($maps.Count -eq 0) {
              Write-Host "::warning title=HardTune::Aucun .map produit"
            }

            foreach ($map in $maps) {
              $tag = $map.BaseName
              Write-Host "=== $($map.FullName) ==="

              $lines = @(Get-Content $map.FullName)
              $base = [uint64]0
              foreach ($l in $lines) {
                if ($l -match 'Preferred load address is\s+([0-9A-Fa-f]+)') {
                  $base = [Convert]::ToUInt64($Matches[1], 16); break
                }
              }

              $syms = New-Object System.Collections.ArrayList
              foreach ($l in $lines) {
                if ($l -match '^\s+([0-9A-Fa-f]{4}):([0-9A-Fa-f]{8})\s+(\S+)\s+([0-9A-Fa-f]{16})\s+(.*)$') {
                  $va = [Convert]::ToUInt64($Matches[4], 16)
                  $rva = if ($base -gt 0 -and $va -ge $base) { $va - $base } else { $va }
                  [void]$syms.Add([pscustomobject]@{
                    Rva  = [uint64]$rva
                    Name = $Matches[3]
                    Obj  = $Matches[5].Trim()
                  })
                }
              }
              Write-Host "$($syms.Count) symboles lus dans $tag (base=0x$($base.ToString('X')))"
              $sorted = @($syms | Sort-Object Rva)

              foreach ($t in $targets) {
                $cand = $sorted | Where-Object { $_.Rva -le [uint64]$t } | Select-Object -Last 1
                if ($cand) {
                  $delta = [uint64]$t - $cand.Rva
                  $next = $sorted | Where-Object { $_.Rva -gt [uint64]$t } | Select-Object -First 1
                  $suivant = if ($next) { " | suivant: $($next.Name) @0x$($next.Rva.ToString('X'))" } else { "" }
                  $msg = "[$tag] 0x$($t.ToString('X')) -> $($cand.Name) +0x$($delta.ToString('X')) <$($cand.Obj)>$suivant"
                } else {
                  $msg = "[$tag] 0x$($t.ToString('X')) -> (rien avant cet offset)"
                }
                Write-Host "HT $msg"
                Write-Host "::warning title=HardTune::$msg"
              }
            }

            # Deuxieme avis : llvm-symbolizer (lit le PDB, voit aussi les
            # fonctions internes que le .map ignore)
            $dll = Get-ChildItem build -Recurse -Filter Alpha-Tune.vst3 -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if ($dll) {
              Write-Host "DLL: $($dll.FullName)"
              $llvm = $null
              if (Get-Command llvm-symbolizer.exe -ErrorAction SilentlyContinue) {
                $llvm = (Get-Command llvm-symbolizer.exe).Source
              } else {
                foreach ($p in @("C:\Program Files\LLVM\bin\llvm-symbolizer.exe",
                                 "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\llvm-symbolizer.exe",
                                 "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\bin\llvm-symbolizer.exe")) {
                  if (Test-Path $p) { $llvm = $p; break }
                }
              }

              if ($llvm) {
                Write-Host "llvm-symbolizer: $llvm"
                foreach ($t in $targets) {
                  $addr = '0x{0:X}' -f (0x180000000 + $t)
                  $out = (& $llvm --obj=$($dll.FullName) --functions=linkage --demangle $addr 2>&1 | Out-String)
                  if ($null -eq $out) { $out = '(vide)' }
                  $flat = ($out -replace '\r?\n', ' | ').Trim()
                  Write-Host "HT-LLVM $addr => $flat"
                  Write-Host "::warning title=HardTune llvm::$($t.ToString('X')) => $flat"
                }
              } else {
                Write-Host "llvm-symbolizer introuvable"
              }
            }
          }
          catch {
            Write-Host "::warning title=HardTune::Etape de symbolisation en erreur : $($_.Exception.Message)"
          }

          exit 0

      - name: Publier
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-Tune-VST3-Windows
          path: build/**/VST3/*.vst3

      - name: Publier les symboles (map + pdb)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-Tune-symboles
          if-no-files-found: warn
          path: |
            build/**/*.map
            build/**/*.pdb
